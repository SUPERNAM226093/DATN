<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mất kết nối - MedPro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #374151;
            text-align: center;
            padding: 20px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #7C6EE6;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #6b7280;
            max-width: 300px;
            line-height: 1.5;
        }
        .btn {
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #7C6EE6;
            color: white;
            border: none;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #6D5DD3;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>Mất kết nối mạng</h1>
    <p>Rất tiếc, thiết bị của bạn đang ngoại tuyến. Vui lòng kiểm tra lại kết nối internet để tiếp tục sử dụng MedPro.</p>
    <button onclick="window.location.reload()" class="btn">Thử lại</button>
</body>
</html>
